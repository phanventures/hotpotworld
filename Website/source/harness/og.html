<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:'BVP';font-weight:800;src:url('../../assets/fonts/bevietnampro-800-latin.woff2') format('woff2')}
@font-face{font-family:'BVP';font-weight:600;src:url('../../assets/fonts/bevietnampro-600-latin.woff2') format('woff2')}
@font-face{font-family:'BVP';font-weight:400;src:url('../../assets/fonts/bevietnampro-400-latin.woff2') format('woff2')}
html,body{margin:0}
.card{position:relative;width:1200px;height:630px;overflow:hidden;background:#0E0D0C;font-family:BVP,sans-serif;color:#F2EDE7}
.card img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.card .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(14,13,12,.96) 0%,rgba(14,13,12,.72) 45%,rgba(14,13,12,.35) 100%)}
.logo{position:absolute;left:72px;top:64px;width:150px}
.text{position:absolute;left:72px;right:72px;bottom:64px}
h1{margin:0 0 18px;font-weight:800;font-size:72px;line-height:1.04;letter-spacing:-.022em}
p{margin:0;font-size:28px;line-height:1.35;font-weight:400;color:#F2EDE7}
p b{font-weight:800}
.pill{display:inline-block;margin-top:26px;padding:12px 26px;border-radius:999px;background:#C0262E;color:#fff;font-weight:600;font-size:24px}
</style>
<div class="card">
  <img class="bg" src="../../assets/img/web/room-wide@2x.jpg" alt="">
  <div class="shade"></div>
  <img class="logo" src="../../assets/img/web/logo-white.png" alt="">
  <div class="text">
    <h1>All you can eat<br>hot pot &amp; BBQ.</h1>
    <p>Conveyor belt service, your own pot, <b>$39.99</b> a person. Federal Way, WA.</p>
    <span class="pill">Hot Pot World Rotary</span>
  </div>
</div>
